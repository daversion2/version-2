<!doctype html>
<html><head><meta charset="utf-8"><title>Video still</title>
<link rel="stylesheet" href="tokens.css">
<!--
  One step of a portrait tutorial: a simulator screenshot in a phone-shaped frame on the
  brand ground, with the step's control highlighted. The band under the frame is left
  clear for the burned-in captions. The engine holds the last frame for as long as the
  narration stays on the step.

  Query params (coordinates in device points, as `maestro hierarchy` reports them):
    img     screenshot path, relative to this file         (required)
    frame   "x,y,w,h" of the screen on the 1080×1920 stage (required)
    device  "w,h" of the screen in points                  (required)
    prev    previous step's screenshot, cross-faded from   (optional)
    box     "x,y,w,h" of the control to highlight          (optional)
    kind    click | look | none                            (click adds a tap dot + ripple)
    zoom    1 = none; e.g. 1.35 eases the camera in on the box (clamped to the frame)
    from    JSON { box, zoom?, kind?, notes? }: where the previous still's camera ended. The
            clip opens on that frame, pulls back far enough to show both boxes, then eases in.
    notes   JSON { tags: [...], arrows: [...] }, drawn in the camera layer:
            tag   { text, at: [x,y] | "right"|"left"|"top"|"bottom", side, gap }
            arrow { from: [x,y], to: [x,y], bend }
-->
<style>
  #frame { position: absolute; overflow: hidden; border-radius: 54px; background: var(--white);
           box-shadow: 0 18px 60px rgba(0, 0, 0, .28), 0 0 0 5px rgba(255, 255, 255, .16); }
  #cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #cam img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #prev { z-index: 1; }
  #dim { z-index: 2; } #ring { z-index: 3; }
  #dim { position: absolute; border-radius: 16px; opacity: 0; pointer-events: none;
         box-shadow: 0 0 0 4000px rgba(0, 0, 0, .14); }
  #ring { position: absolute; border-radius: 16px; opacity: 0; box-sizing: border-box;
          border: 5px solid var(--accent);
          box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 24%, transparent), 0 6px 24px color-mix(in srgb, var(--accent) 35%, transparent); }
  #cursor { position: absolute; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; opacity: 0; z-index: 4;
            background: color-mix(in srgb, var(--accent) 55%, transparent); border: 4px solid var(--white); box-sizing: border-box;
            box-shadow: 0 3px 12px rgba(0, 0, 0, .35); }
  #ripple { position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%;
            border: 4px solid var(--accent); background: color-mix(in srgb, var(--accent) 22%, transparent); opacity: 0; z-index: 3; }
  #notes { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; z-index: 2; pointer-events: none; }
  .tag { position: absolute; z-index: 3; white-space: nowrap; opacity: 0;
         font-family: var(--sans); font-weight: 800; font-size: 32px; color: var(--white);
         background: var(--accent); padding: 9px 18px 10px; border-radius: 14px;
         box-shadow: 0 6px 20px rgba(0, 0, 0, .28), 0 0 0 3px rgba(255, 255, 255, .92); }
  .lead { stroke: var(--accent); stroke-width: 4; fill: none; stroke-linecap: round; }
  .anchor { fill: var(--accent); stroke: var(--white); stroke-width: 3; }
  .arrow { stroke: var(--accent); stroke-width: 5; fill: none; stroke-linecap: round; }
  .head { fill: var(--accent); }
</style></head>
<body><div id="stage">
  <div id="frame"><div id="cam"><img id="shot" alt=""><img id="prev" alt=""><div id="dim"></div><div id="ring"></div><div id="ripple"></div>
    <svg id="notes"></svg><div id="cursor"></div>
  </div></div>
</div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="lib.js"></script>
<script>
const P = window.params;
const [FX, FY, FW, FH] = P.frame.split(",").map(Number);
const [DW] = P.device.split(",").map(Number);
const S = FW / DW; // device points → stage px
Object.assign(document.getElementById("frame").style, { left: FX + "px", top: FY + "px", width: FW + "px", height: FH + "px" });
Object.assign(document.getElementById("cam").style, { width: FW + "px", height: FH + "px" });
document.getElementById("notes").setAttribute("viewBox", `0 0 ${FW} ${FH}`);
const shot = document.getElementById("shot");
const prev = document.getElementById("prev");
const tl = gsap.timeline({ paused: true });
const loads = [new Promise((r) => { shot.onload = r; shot.onerror = r; shot.src = P.img; })];
if (P.prev) loads.push(new Promise((r) => { prev.onload = r; prev.onerror = r; prev.src = P.prev; }));
else prev.style.display = "none";

Promise.all(loads).then(() => {
  if (P.prev) tl.to(prev, { opacity: 0, duration: 0.35, ease: "power1.inOut" }, 0);

  const box = P.box ? P.box.split(",").map(Number).map((n) => n * S) : null;
  const zoom = Math.max(1, +(P.zoom || 1));
  const from = P.from ? JSON.parse(P.from) : null;
  const fbox = from?.box ? from.box.map((n) => n * S) : null;
  const fzoom = Math.max(1, +(from?.zoom || 1));
  // Camera that centres box b at zoom z, never showing past the frame's edges.
  const camFor = (b, z) => {
    if (!b || z <= 1) return { x: 0, y: 0, scale: 1 };
    const cx = b[0] + b[2] / 2, cy = b[1] + b[3] / 2;
    return {
      x: Math.min(0, Math.max(FW * (1 - z), FW / 2 - cx * z)),
      y: Math.min(0, Math.max(FH * (1 - z), FH / 2 - cy * z)),
      scale: z,
    };
  };
  const place = (b) => ({ left: b[0] + "px", top: b[1] + "px", width: b[2] + "px", height: b[3] + "px" });
  // A tap lands in the middle of the control.
  const tapAt = (b) => [b[0] + b[2] / 2, b[1] + b[3] / 2];
  const startCam = camFor(fbox, fzoom), endCam = camFor(box, zoom);
  gsap.set("#cam", startCam);
  // Open on the previous still's last frame: its ring, dim and tap dot, then let them go.
  if (fbox) {
    gsap.set(["#ring", "#dim"], { ...place(fbox), opacity: 1 });
    tl.to(["#ring", "#dim"], { opacity: 0, duration: 0.4, ease: "power1.inOut" }, 0.1);
  }
  let camEnd = 1.2;
  if (startCam.scale > 1 && box && endCam.scale > 1) {
    // Pull back just far enough to show both boxes, then push in on the new one.
    const ux = Math.min(fbox[0], box[0]), uy = Math.min(fbox[1], box[1]);
    const uw = Math.max(fbox[0] + fbox[2], box[0] + box[2]) - ux, uh = Math.max(fbox[1] + fbox[3], box[1] + box[3]) - uy;
    const fit = Math.max(1, Math.min(FW / (uw * 1.35), FH / (uh * 1.35), fzoom, zoom));
    tl.to("#cam", { ...camFor([ux, uy, uw, uh], fit), duration: 0.8, ease: "power2.inOut" }, 0.3)
      .to("#cam", { ...endCam, duration: 0.9, ease: window.EASE_IO }, 1.15);
    camEnd = 2.05;
  } else if (startCam.scale > 1) {
    tl.to("#cam", { ...endCam, duration: 1.0, ease: "power2.inOut" }, 0.3);
    camEnd = 1.3;
  } else if (endCam.scale > 1) {
    tl.to("#cam", { ...endCam, duration: 0.9, ease: window.EASE_IO }, 0.3);
  }
  const ringAt = camEnd - 0.35;
  if (box) {
    tl.set(["#ring", "#dim"], place(box), Math.max(0.5, ringAt - 0.1));
    tl.fromTo("#dim", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.out", immediateRender: false }, ringAt - 0.05)
      .fromTo("#ring", { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.45, ease: window.EASE, immediateRender: false }, ringAt);
    if (P.kind === "click") {
      const [px, py] = tapAt(box);
      tl.set("#cursor", { left: px, top: py }, ringAt);
      gsap.set("#ripple", { left: px, top: py });
      tl.fromTo("#cursor", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: window.EASE, immediateRender: false }, ringAt + 0.1)
        .fromTo("#ripple", { opacity: 0.9, scale: 0.3 }, { opacity: 0, scale: 1.5, duration: 0.55, ease: "power1.out", immediateRender: false }, ringAt + 0.55)
        // The dot lifts after the tap: the held frame must not cover the control's label.
        .to("#cursor", { opacity: 0, duration: 0.25, ease: "power1.out" }, ringAt + 0.8);
    }
  }
  let end = Math.max(1.9, ringAt + 1.1);
  const noteAt = ringAt + 0.3;
  const svg = document.getElementById("notes");
  // Tags and arrows for box b. `leaving`: the previous still's callouts, shown fully at the
  // first frame and faded out with its ring, so they don't vanish in a cut.
  const drawNotes = (notes, b, at0, leaving) => {
    const fade = [];
    const pt = (p) => {
      if (Array.isArray(p)) return [p[0] * S, p[1] * S];
      if (!b) return [FW / 2, FH / 2];
      const [x, y, w, h] = b;
      return { right: [x + w, y + h / 2], left: [x, y + h / 2], top: [x + w / 2, y], bottom: [x + w / 2, y + h] }[p] ?? [x + w, y + h / 2];
    };
    (notes.arrows ?? []).forEach((a, i) => {
      const [x1, y1] = pt(a.from), [x2, y2] = pt(a.to);
      const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
      const bend = a.bend ?? 0.25 * len;
      const cx = (x1 + x2) / 2 - (dy / len) * bend, cy = (y1 + y2) / 2 + (dx / len) * bend;
      const tx = x2 - cx, ty = y2 - cy, tl2 = Math.hypot(tx, ty) || 1;
      const ex = x2 - (tx / tl2) * 14, ey = y2 - (ty / tl2) * 14;
      const path = svgEl(svg, "path", { class: "arrow", d: `M${x1} ${y1} Q${cx} ${cy} ${ex} ${ey}` });
      const ang = Math.atan2(ty, tx) * 180 / Math.PI;
      const head = svgEl(svg, "path", { class: "head", d: "M0 0 L-22 -12 L-22 12 Z", transform: `translate(${x2} ${y2}) rotate(${ang})`, opacity: leaving ? 1 : 0 });
      if (leaving) { fade.push(path, head); return; }
      const at = at0 + i * 0.2;
      draw(tl, path, 0.5, at, "power2.out");
      tl.to(head, { opacity: 1, duration: 0.15 }, at + 0.4);
      end = Math.max(end, at + 0.9);
    });
    (notes.tags ?? []).forEach((t, i) => {
      const [ax, ay] = pt(t.at ?? "bottom");
      const side = t.side ?? "bottom", gap = t.gap ?? 34;
      const el = document.createElement("div");
      el.className = "tag";
      el.textContent = t.text;
      document.getElementById("cam").appendChild(el);
      const w = el.offsetWidth, h = el.offsetHeight;
      const pos = {
        right: [ax + gap, ay - h / 2, ax + gap, ay], left: [ax - gap - w, ay - h / 2, ax - gap, ay],
        top: [ax - w / 2, ay - gap - h, ax, ay - gap], bottom: [ax - w / 2, ay + gap, ax, ay + gap],
      }[side];
      // Keep the tag inside the narrow portrait frame.
      pos[0] = Math.max(12, Math.min(FW - w - 12, pos[0]));
      gsap.set(el, { left: pos[0], top: pos[1] });
      const lead = svgEl(svg, "line", { class: "lead", x1: ax, y1: ay, x2: pos[2], y2: pos[3] });
      const dot = svgEl(svg, "circle", { class: "anchor", cx: ax, cy: ay, r: 8, opacity: leaving ? 1 : 0 });
      if (leaving) { gsap.set(el, { opacity: 1 }); fade.push(el, lead, dot); return; }
      const at = at0 + 0.05 + i * 0.18;
      const off = { right: [-14, 0], left: [14, 0], top: [0, 14], bottom: [0, -14] }[side];
      tl.to(dot, { opacity: 1, duration: 0.2 }, at);
      draw(tl, lead, 0.25, at, "power2.out");
      tl.fromTo(el, { opacity: 0, x: off[0], y: off[1] }, { opacity: 1, x: 0, y: 0, duration: 0.4, ease: window.EASE }, at + 0.12);
      end = Math.max(end, at + 0.8);
    });
    if (fade.length) tl.to(fade, { opacity: 0, duration: 0.4, ease: "power1.inOut" }, 0.1);
  };
  if (from?.notes && fbox) drawNotes(from.notes, fbox, 0, true);
  const notes = P.notes ? JSON.parse(P.notes) : null;
  if (notes) drawNotes(notes, box, noteAt, false);
  tl.to({}, { duration: 0 }, end);
  window.tl = tl;
  window.DURATION = end;
});
</script>
</body></html>
