<!doctype html>
<html><head><meta charset="utf-8"><title>Video intro</title>
<link rel="stylesheet" href="tokens.css">
<!-- Silent opening card, 2.6 s: the mark on the brand teal, then the video's title (?title=). -->
<style>
  #disc { position: absolute; left: 290px; top: 520px; width: 500px; height: 500px; border-radius: 50%; background: var(--white); opacity: 0; }
  #mark { position: absolute; left: 90px; top: 320px; width: 900px; height: 900px; opacity: 0; }
  #name { position: absolute; left: 0; right: 0; top: 1080px; text-align: center; opacity: 0;
          font-weight: 800; font-size: 72px; letter-spacing: -.01em; color: var(--white); }
  #title { position: absolute; left: 90px; right: 90px; top: 1190px; text-align: center; opacity: 0;
           font-weight: 500; font-size: 50px; line-height: 1.2; color: var(--white); }
</style></head>
<body><div id="stage"><div id="disc"></div><img id="mark" src="assets/logo.png" alt=""><div id="name">Neuro-Nudge</div><div id="title"></div></div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="lib.js"></script>
<script>
document.getElementById("title").textContent = window.params.title ?? "";
const tl = gsap.timeline({ paused: true });
tl.fromTo(["#disc", "#mark"], { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.7, ease: window.EASE }, 0.1)
  .fromTo("#name", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.55)
  .fromTo("#title", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.8)
  .to(["#disc", "#mark", "#name", "#title"], { opacity: 0, duration: 0.35, ease: "power1.in" }, 2.25)
  .to({}, { duration: 0 }, 2.6);
window.tl = tl; window.DURATION = 2.6;
</script>
</body></html>
