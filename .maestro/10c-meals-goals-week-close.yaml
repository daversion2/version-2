# Meals (Lab): the Scoring settings change the day's result; a food-group goal
# is a progress readout that never gates it; the week adds the scores up;
# closing out an off-target day with no habit linked writes no check-in, and
# reopens. Continues from 10b: today = three plates (80, 57, 85) plus a
# Processed "Donut" (0), averaging 56, off target at the default threshold 70.
appId: com.neuronudge.neuronudge
---
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
- extendedWaitUntil:
    visible: "Close Meals"
    timeout: 20000
- tapOn: "Meals settings"
- extendedWaitUntil:
    visible: "MY MEALS"
    timeout: 10000

# Lower the on-target threshold below the day's 56 average: the day can flip
# from settings alone, with nothing about the meals changing.
- scrollUntilVisible:
    element:
      text: "On target at"
    direction: DOWN
    timeout: 10000
- tapOn: "Fewer on-target threshold"
- tapOn: "Fewer on-target threshold"
- tapOn: "Fewer on-target threshold"
- extendedWaitUntil:
    visible: "55"
    timeout: 10000

# A daily goal of veggies at 2 meals. A progress readout only — it doesn't
# gate the day (founder, 2026-10-26), unlike the old pass-goal miss allowance.
- scrollUntilVisible:
    element:
      text: ".*Add a food-group goal|Veggies at .*"
    direction: DOWN
    timeout: 20000
- runFlow:
    when:
      notVisible: "Veggies at .*"
    commands:
      - tapOn: ".*Add a food-group goal"
- scrollUntilVisible:
    element: "More times"
    direction: DOWN
    timeout: 20000
- runFlow:
    when:
      visible: "Veggies at 1 meal a day"
    commands:
      - tapOn: "More times"
- extendedWaitUntil:
    visible: "Veggies at 2 meals a day"
    timeout: 10000
- takeScreenshot: 10c-1-settings

# Back on the day: the lower threshold alone puts it on target. Only lunch
# had veggies, so the goal reads unmet — but it doesn't hold the day off.
- tapOn: "Meals"
- extendedWaitUntil:
    visible: "On target"
    timeout: 10000
- assertVisible: "Averaged 56 · at or above your target of 55"
- assertVisible: "Veggies 1/2"
- takeScreenshot: 10c-2-goal-unmet-still-on

# Add veggies to dinner too: the goal reads met, but the score and status are
# unchanged — dinner was already all whole food, so its score doesn't move.
- tapOn: "Dinner: .*"
- scrollUntilVisible:
    element:
      id: "meal-chip-veggies"
    direction: DOWN
    centerElement: true
    timeout: 10000
- tapOn:
    id: "meal-chip-veggies"
- tapOn: ".*Save"
- extendedWaitUntil:
    visible: "Dinner: Fish & seafood · Grains & starches · Veggies"
    timeout: 10000
- assertVisible: "On target"
- assertVisible: "Averaged 56 · at or above your target of 55"
- assertVisible: "Veggies 2/2 ✓"
- takeScreenshot: 10c-3-goal-met-no-change

# Raise the threshold back to default: the day flips off target again, still
# from settings alone.
- tapOn: "Meals settings"
- extendedWaitUntil:
    visible: "MY MEALS"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "On target at"
    direction: DOWN
    timeout: 10000
- tapOn: "More on-target threshold"
- tapOn: "More on-target threshold"
- tapOn: "More on-target threshold"
- extendedWaitUntil:
    visible: "70"
    timeout: 10000
- tapOn: "Meals"
- extendedWaitUntil:
    visible: "Off target"
    timeout: 10000
- assertVisible: "Averaged 56 · below your target of 70"
- takeScreenshot: 10c-4-day-off-again

# The week: this week's four plates (breakfast, lunch, dinner, the donut)
# average 56; Lunch (57) is the one under target.
- tapOn: "This week"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "56"
- assertVisible: "average plate score this week · 4 plates logged"
- assertVisible: "Lunch is the one slipping — it's averaging 57, under your target."
- takeScreenshot: 10c-5-week
- tapOn:
    point: "9%,9%"
- extendedWaitUntil:
    visible: "Close Meals"
    timeout: 10000

# Close out off target with no habit linked: shows the result, writes no
# check-in.
- tapOn: ".*Close out the day"
- extendedWaitUntil:
    visible: "Off target"
    timeout: 10000
- assertVisible: "Not this time. Every meal you logged still counts toward your week."
- assertVisible: "56 · target 70\\+"
- takeScreenshot: 10c-6-close
- tapOn: ".*Close the day"
- extendedWaitUntil:
    visible: "Closed.*"
    timeout: 15000
- assertNotVisible: ".*Close out the day"
- takeScreenshot: 10c-7-closed

# Reopen it.
- tapOn: "Reopen today"
- tapOn: "Reopen"
- extendedWaitUntil:
    visible: ".*Close out the day"
    timeout: 10000
