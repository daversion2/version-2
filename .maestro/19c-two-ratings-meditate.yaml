# Two ratings (9211b7d), Meditate: Begin asks "How hard is it to start?";
# Log a past session's new hint. WRITES NOTHING: Cancels the sheet and the
# past-session sheet. Never taps "Got it" on the intro (that writes prefs).
appId: com.neuronudge.neuronudge
---
- launchApp
- extendedWaitUntil:
    visible:
      text: "Today, tab.*"
    timeout: 60000
- extendedWaitUntil:
    visible: "Your apps"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: ".*Open debugger to view warnings.*"
    commands:
      - tapOn:
          point: "92%,93%"
- takeScreenshot: 19c-00-today
- tapOn: "Meditate"
- extendedWaitUntil:
    visible: "Start a session"
    timeout: 20000
- tapOn: "Start a session"
- extendedWaitUntil:
    visible: "Begin · .*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 19c-01-meditate-home
- tapOn: "Begin · .*"
- waitForAnimationToEnd
# A session already open would show "A session is still open" — do not discard.
- assertNotVisible: ".*A session is still open.*"
- extendedWaitUntil:
    visible: "How hard is it to start\\?"
    timeout: 10000
- assertVisible: "Override · Meditate|OVERRIDE · MEDITATE"
- assertVisible: "1, Easy start\\. Barely thinking about it\\. Starts\\."
- assertVisible: "2, Have to push\\. Talking myself into it\\. Starts\\."
- assertVisible: "3, Took everything\\. Almost talked myself out of it\\. Starts\\."
- assertVisible: "Tap one to start\\."
- takeScreenshot: 19c-02-meditate-sheet
- tapOn:
    text: "Cancel"
    below: "Tap one to start\\."
- waitForAnimationToEnd
- assertNotVisible: "How hard is it to start\\?"
- assertVisible: "Begin · .*"
- takeScreenshot: 19c-03-after-cancel
# Log a past session -> hint; Cancel, never Save
- scrollUntilVisible:
    element: "Log a past session"
    direction: DOWN
    timeout: 15000
- tapOn: "Log a past session"
- extendedWaitUntil:
    visible: ".*Save & rate it.*"
    timeout: 10000
- waitForAnimationToEnd
- assertVisible: "Next, on Today: how hard it was to start, then how hard you pushed\\."
- takeScreenshot: 19c-04-past-session
# The sheet's only "Cancel" node is its backdrop (the footer has no Cancel button).
- tapOn: "Cancel"
- waitForAnimationToEnd
- assertNotVisible: ".*Save & rate it.*"
- takeScreenshot: 19c-05-past-session-cancelled
