# Meals (Lab): a Processed snack is one miss. Continues from 10a — the day is
# on target with three passing meals and a "pass 3 of 3" goal.
appId: com.neuronudge.neuronudge
---
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - hideKeyboard
      - tapOn: "Cancel"
- extendedWaitUntil:
    visible: "On target"
    timeout: 20000
- tapOn: ".*Add something"
- extendedWaitUntil:
    visible:
      id: "meal-chip-processed"
    timeout: 10000
- tapOn: "What was it.*"
- inputText: "Donut"
- hideKeyboard
- tapOn:
    id: "meal-chip-processed"
- assertVisible: "Fail"
- tapOn: ".*Save"
# With no misses to spare, the snack alone puts the day off target.
- extendedWaitUntil:
    visible: "Off target"
    timeout: 10000
- assertVisible: "Donut: Processed"
- takeScreenshot: 10b-1-snack-off
