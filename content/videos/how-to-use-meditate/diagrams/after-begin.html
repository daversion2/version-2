<!doctype html>
<html><head><meta charset="utf-8"><title>After Begin</title>
<link rel="stylesheet" href="tokens.css">
<!-- What happens after Begin, so the capture never has to start a real session.
     Stages: 0–1.2 lock your phone · 1.2–2.4 the bell · 2.4–3.6 finish and rate. -->
<style>
  .card { position: absolute; left: 90px; width: 900px; height: 390px; box-sizing: border-box; padding: 0 56px;
          display: flex; align-items: center; gap: 48px; border-radius: 44px; background: var(--white); opacity: 0;
          box-shadow: 0 18px 50px rgba(0, 0, 0, .22); }
  .icon { flex: none; width: 150px; height: 150px; border-radius: 50%; background: var(--primary);
          display: flex; align-items: center; justify-content: center; }
  .icon svg { width: 84px; height: 84px; fill: none; stroke: var(--white); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  h2 { margin: 0 0 10px; font-size: 58px; line-height: 1.08; font-weight: 800; color: var(--ink); }
  p { margin: 0; font-size: 38px; line-height: 1.2; font-weight: 500; color: var(--gray); }
</style></head>
<body><div id="stage">
  <div class="card" id="c1" style="top:150px"><div class="icon"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div><div><h2>Lock your phone</h2><p>Nothing here needs you</p></div></div>
  <div class="card" id="c2" style="top:610px"><div class="icon"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg></div><div><h2>A bell rings</h2><p>When your time is up</p></div></div>
  <div class="card" id="c3" style="top:1070px"><div class="icon"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div><div><h2>Finish &amp; rate it</h2><p>How hard was it to stay with it?</p></div></div>
</div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="lib.js"></script>
<script>
const tl = gsap.timeline({ paused: true });
[["#c1", 0.15], ["#c2", 1.3], ["#c3", 2.5]].forEach(([el, at]) =>
  tl.fromTo(el, { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.6, ease: window.EASE }, at));
tl.to({}, { duration: 0 }, 3.6);
window.tl = tl; window.DURATION = 3.6;
</script>
</body></html>
